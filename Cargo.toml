[workspace]
members = [
    "crates/forgesync-core",
    "crates/forgesync-store",
    "crates/forgesync-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }

[profile.release]
lto = "thin"
codegen-units = 1
