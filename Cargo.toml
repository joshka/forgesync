[workspace]
members = [
    "crates/forgesync",
    "crates/forgesync-core",
    "crates/forgesync-github",
    "crates/forgesync-store",
    "crates/forgesync-engine",
    "crates/forgesync-tui",
    "crates/forgesync-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
regex = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
