name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: forgesync
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: forgesync
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: forgesync
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: forgesync.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Build native CLI
        run: cargo build -p forgesync --release --locked
      - name: Smoke test without credentials
        run: python scripts/smoke_binary.py target/release/${{ matrix.binary }}
      - name: Package native binary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: >-
          python scripts/package_binary.py
          --binary target/release/${{ matrix.binary }}
          --target ${{ matrix.target }}
          --tag "$RELEASE_TAG"
          --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: forgesync-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum forgesync_* > checksums.txt
      - name: Verify asset inventory
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            find dist -maxdepth 1 -name "forgesync_*_${target}.*" -print -quit | grep .
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
