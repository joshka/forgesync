name: Platform checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: forgesync
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: forgesync
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: forgesync.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build native CLI
        run: cargo build -p forgesync --release --locked
      - name: Smoke test without credentials
        run: python scripts/smoke_binary.py target/release/${{ matrix.binary }}
      - name: Package native binary
        run: >-
          python scripts/package_binary.py
          --binary target/release/${{ matrix.binary }}
          --target ${{ matrix.target }}
          --output target/package-smoke
      - name: Check package exists
        run: python -c "from pathlib import Path; assert list(Path('target/package-smoke').iterdir())"
