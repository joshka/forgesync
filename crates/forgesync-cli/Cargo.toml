[package]
name = "forgesync-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-line process interface for Forgesync"

[features]
default = ["tui"]
tui = ["dep:forgesync-tui"]

[dependencies]
clap.workspace = true
etcetera.workspace = true
forgesync-core = { version = "0.1.0", path = "../forgesync-core" }
forgesync-engine = { version = "0.1.0", path = "../forgesync-engine" }
forgesync-github = { version = "0.1.0", path = "../forgesync-github" }
forgesync-store = { version = "0.1.0", path = "../forgesync-store" }
forgesync-tui = { version = "0.1.0", path = "../forgesync-tui", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
rstest = "0.27.0"
