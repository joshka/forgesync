[package]
name = "forgesync-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["tui"]
tui = ["dep:forgesync-tui"]

[[bin]]
name = "forgesync"
path = "src/main.rs"

[dependencies]
clap.workspace = true
etcetera.workspace = true
forgesync-core = { path = "../forgesync-core" }
forgesync-engine = { path = "../forgesync-engine" }
forgesync-github = { path = "../forgesync-github" }
forgesync-store = { path = "../forgesync-store" }
forgesync-tui = { path = "../forgesync-tui", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
assert_cmd = "2"
rstest = "0.27.0"
